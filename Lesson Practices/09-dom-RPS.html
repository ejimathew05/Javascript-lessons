<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors DOM</title>
    <link rel="stylesheet" href="Styles/09-dom-RPS.css">
</head>

<body>
    <h1>Rock Paper Scissors</h1>
    <button onclick="
    playGame('Rock')
    " class="move-button"><img src="images/Rock.png" alt="" class="move-img"></button>

    <button onclick="
    playGame('Paper')
    " class="move-button"><img src="images/Paper.png" alt="" class="move-img"></button>

    <button onclick="
        playGame('Scissors')
        " class="move-button" ><img src="images/Scissors.png" alt="" class="move-img"></button>

    <p class="js-result css-result"></p>

    <p class="js-moves"></p>

    <P class="js-score"></P>

    <P><button class="reset-button" onclick="
    scores.wins = 0;
    scores.losses = 0;
    scores.ties = 0;
    localStorage.removeItem('score');
    updateScore();
    ">Reset scores</button></P>


    <script src="Javascript/09-dom-RPS.js"></script>

</body>
</html>
