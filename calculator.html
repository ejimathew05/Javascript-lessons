<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathew's calculator</title>
    <link rel="stylesheet" href="Styles/calculator.css">
</head>
<body>
    <p class="js-output css-score"></p>
    
    <p><button class="gray-button" onclick="updateCalculation('1');
    displayResult ();">1</button>
    <button class="gray-button" onclick="updateCalculation('2');
    displayResult ();">2</button>
    <button class="gray-button" onclick="updateCalculation('3');
    displayResult ();">3</button>
    <button class="yellow-button" onclick="updateCalculation(' + ');
    displayResult ();">+</button></p>

    <p><button class="gray-button" onclick="updateCalculation('4');
    displayResult ();">4</button>
    <button class="gray-button" onclick="updateCalculation('5');
    displayResult ();">5</button>
    <button class="gray-button" onclick="updateCalculation('6');
    displayResult ();">6</button>
    <button class="yellow-button" onclick="updateCalculation(' - ');
    displayResult ();">-</button></p>

    <p><button class="gray-button" onclick="updateCalculation('7');
    displayResult ();">7</button>
    <button class="gray-button" onclick="updateCalculation('8');
    displayResult ();">8</button>
    <button class="gray-button" onclick="updateCalculation('9');
    displayResult ();">9</button>
    <button class="yellow-button" onclick="updateCalculation(' * ');
    displayResult ();">*</button></p>

    <p><button class="gray-button" onclick="
        updateCalculation('0');
        displayResult ();">0</button>
        <button class="gray-button" onclick="
        updateCalculation('.');
        displayResult ();">.</button>
        <button class="gray-button" onclick="
        calculation = eval(calculation);
        const output = document.querySelector('.js-output');
        output.innerHTML = Number(calculation); 
    saveCalculation();
    ">=</button>
    <button class="yellow-button" onclick="updateCalculation(' / ');
    displayResult ();">/</button>
    
    <p><button class="gray-button spec-button" onclick="calculation = '';
        const output = document.querySelector('.js-output');
    output.innerHTML = Number(0);
        ">Clear</button>
        <button class="gray-button spec-button" onclick="
    JSON.parse(localStorage.getItem('result'));
    displayResult();">Ans</button>
    <button class="gray-button spec-button" onclick="">Del</button></p>
    
    
    <script src="Javascript/calculator.js"></script>
</body>
</html>
