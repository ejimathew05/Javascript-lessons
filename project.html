<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>

<body>
    <h1>Rock Paper Scissors Game</h1>
    <button onclick="
    playGame('Rock')
    ">Rock</button>

    <button onclick="
    playGame('Paper')
    ">Paper</button>

    <button onclick="
        playGame('Scissors')
        ">Scissors</button>

    <button onclick="
    localStorage.removeItem('score');
    ">Reset scores</button>


    <script>
        
        function playGame(playerMove) {
        let scores = JSON.parse(localStorage.getItem('score')) || {
        wins: 0,
        losses: 0,
        ties: 0
        };
        
        const computerMove = pickComputerMove();
        let result = '';
        if (playerMove = 'Rock') {
        if (computerMove === 'Rock') { result = 'Tie';
        } else if (computerMove === 'Paper') { result = 'You lose';} else if (computerMove === 'Scissors') {result = 'You win';};
        }

        if (playerMove = 'Paper') {
        const computerMove = pickComputerMove()
        if (computerMove === 'Rock') { result = 'You win';
        } else if (computerMove === 'Paper') { result = 'Tie';} else if (computerMove === 'Scissors') {result = 'You lose';}
        }

        if (playerMove = 'Scissors') {
        const computerMove = pickComputerMove()

        if (computerMove === 'Rock') { result = 'You lose';
        } else if (computerMove === 'Paper') { result = 'You win';} else if (computerMove === 'Scissors') {result = 'Tie';}
        }

        if (result === 'You win') {scores.wins += 1;} else if (result === 'You lose') {scores.losses += 1;} else if (result === 'Tie') {scores.ties += 1;};

        localStorage.setItem('score', JSON.stringify(scores))
        
        alert (`You picked ${playerMove}. Computer picked ${computerMove}. ${result}. 
Wins: ${scores.wins}, Losses: ${scores.losses}, Ties ${scores.ties}.`);
}
        function pickComputerMove() {
            const randomNumber = Math.random();
            let computerMove = '';

            if (randomNumber >= 0 && randomNumber < 1 / 2) {
                computerMove = 'Rock';

            } else if (randomNumber >= 1 / 2 && randomNumber < 2 / 3) {
                computerMove = 'Paper';

            } else if (randomNumber >= 2 / 3 && randomNumber < 1) { computerMove = 'Scissors'; };

            return computerMove;
        } 
    </script>

</body>

</html>
